// The wire protocol between basrd and its clients (basrctl, TUI, GUI).
//
// ACP payloads are canonical JSON serialized by agent-client-protocol.
// Protobuf only defines daemon management, routing and replay envelopes.

syntax = "proto3";

package basr.v1;

// Daemon administration and session I/O.
service Basr {
  // Lists the agent backends this daemon can launch.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Checks a saved configuration, optionally performing an isolated ACP handshake.
  rpc CheckAgent(CheckAgentRequest) returns (CheckAgentResponse);
  // Starts a session on a backend.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Lists non-archived sessions by default.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Reads one session's metadata.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // Hides/restores a session without stopping its backend or deleting history.
  rpc SetArchived(SetArchivedRequest) returns (SetArchivedResponse);
  // Stops a session's backend and forgets it.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  // Attaches to a session: replays history, then streams live events until the
  // client disconnects. Detaching never stops the agent.
  rpc Attach(AttachRequest) returns (stream Event);
  // Tracks the session currently viewed in an active client window. Closing
  // this stream releases its foreground state without affecting agent work.
  rpc SetForeground(stream ForegroundRequest) returns (stream ForegroundResponse);
  // Sends a user turn.
  rpc Prompt(AcpPayload) returns (TurnAccepted);
  // Cancels the running turn.
  rpc Cancel(AcpPayload) returns (CancelResponse);
  // ACP session/set_config_option request and response.
  rpc SetConfigOption(AcpPayload) returns (AcpPayload);
  // ACP session/set_mode request and response.
  rpc SetMode(AcpPayload) returns (AcpPayload);
  // Subscribes an interactive approver; each update replaces the pending set.
  // Unsubscribing the last approver cancels outstanding approval requests.
  rpc WatchPermissions(WatchPermissionsRequest) returns (stream PermissionSnapshot);
  // Answers exactly one live ACP request using an agent-provided option id.
  rpc RespondPermission(RespondPermissionRequest) returns (RespondPermissionResponse);
  // Renames a session.
  rpc SetTitle(SetTitleRequest) returns (SetTitleResponse);
  // Loads a page of history by cursor.
  rpc LoadHistory(LoadHistoryRequest) returns (LoadHistoryResponse);
}

// One configured agent backend.
message Agent {
  string id = 1;
  // "embedded" or "acp".
  string kind = 2;
  // Command line for external backends, empty for the embedded one.
  string command = 3;
}

message ListAgentsRequest {}

message CheckAgentRequest {
  string agent = 1;
  // Required serialized AgentSpec; must match the daemon's current configuration.
  bytes expected_spec_json = 2;
  bool connect = 3;
}

enum AgentCheckStatus {
  AGENT_CHECK_STATUS_UNSPECIFIED = 0;
  AGENT_CHECK_STATUS_MISSING_EXECUTABLE = 1;
  AGENT_CHECK_STATUS_INSTALLED = 2;
  AGENT_CHECK_STATUS_CONNECTED = 3;
  AGENT_CHECK_STATUS_FAILED = 4;
  AGENT_CHECK_STATUS_AUTHENTICATION_REQUIRED = 5;
}

message CheckAgentResponse {
  AgentCheckStatus status = 1;
  string message = 2;
  string resolved_program = 3;
  // Canonical ACP InitializeResponse, when initialize completed.
  AcpPayload initialization = 4;
  // Native AuthRequired error; may contain updated authMethods.
  AcpPayload authentication_error = 5;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

// Who created a session.
message Owner {
  string user = 1;
  string host = 2;
}

// Lifecycle of a session.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_STARTING = 1;
  SESSION_STATUS_IDLE = 2;
  SESSION_STATUS_WORKING = 3;
  SESSION_STATUS_STOPPED = 4;
  SESSION_STATUS_FAILED = 5;
}

// A session's metadata, without its events.
message Session {
  string id = 1;
  string agent = 2;
  optional string title = 3;
  Owner owner = 4;
  optional string cwd = 5;
  // Milliseconds since the Unix epoch.
  uint64 created_at = 6;
  uint64 updated_at = 7;
  SessionStatus status = 8;
  // ACP InitializeResponse.
  AcpPayload initialization = 9;
  // ACP NewSessionResponse with current modes/configOptions.
  AcpPayload acp = 10;
  // Latest ACP AvailableCommandsUpdate, retained beyond the history window.
  AcpPayload available_commands = 11;
  // Last event reflected in this snapshot; independent of retained history.
  uint64 revision = 12;
  optional string active_turn = 13;
  // Independent of lifecycle: a running turn may finish while archived.
  bool archived = 14;
  // Last agent message chunk; metadata-only changes are not unread replies.
  uint64 last_reply = 15;
}

message CreateSessionRequest {
  // Backend id, from ListAgents. Defaults to "embedded" when empty.
  string agent = 1;
  optional string title = 2;
  optional string cwd = 3;
  optional string owner_user = 4;
  optional string owner_host = 5;
}

message CreateSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  bool include_archived = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message GetSessionRequest {
  string session = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message SetArchivedRequest {
  string session = 1;
  bool archived = 2;
}

message SetArchivedResponse {
  // Snapshot committed under the same lock as the archive transition.
  Session session = 1;
}

message DeleteSessionRequest {
  string session = 1;
}

message DeleteSessionResponse {}

// Canonical ACP JSON. Use the SDK schema named by each field or RPC.
// bytes preserves JSON numbers and extension metadata without Struct conversion.
message AcpPayload {
  bytes json = 1;
}

message TurnStarted {
  string turn = 1;
}

message TurnFinished {
  string turn = 1;
  reserved 2;
  // Exactly one outcome: ACP PromptResponse or a daemon failure.
  oneof outcome {
    AcpPayload response = 3;
    string error = 4;
  }
}

message TitleChanged {
  string title = 1;
}

message ArchiveChanged {
  bool archived = 1;
}

message StatusChanged {
  SessionStatus status = 1;
}

message Failed {
  string message = 1;
}

// One event in a session timeline.
message Event {
  string session = 1;
  // Monotonic position; pass the last one seen back to Attach or LoadHistory.
  uint64 cursor = 2;
  uint64 at = 3;
  reserved 10, 11, 12;
  oneof kind {
    // ACP SessionUpdate, including content, tools, plans, commands and options.
    AcpPayload acp_update = 18;
    TurnStarted turn_started = 13;
    TurnFinished turn_finished = 14;
    TitleChanged title_changed = 15;
    StatusChanged status_changed = 16;
    Failed failed = 17;
    ArchiveChanged archive_changed = 19;
  }
}

message AttachRequest {
  string session = 1;
  // Resume strictly after this cursor. Absent means "the newest replay events".
  optional uint64 cursor = 2;
  // Recent replayable events when cursor is absent. With cursor, all retained
  // events after it are replayed; an expired cursor returns DATA_LOSS.
  uint32 replay = 3;
}

message ForegroundRequest {
  // Absent when the window is inactive or no session is selected.
  optional string session = 1;
}

// Acknowledges that the foreground state has been applied.
message ForegroundResponse {}

// Prompt completion arrives asynchronously in TurnFinished.
message TurnAccepted {
  string turn = 1;
  // Cursor of the TurnStarted event. Zero means an older server omitted it.
  uint64 cursor = 2;
}

message CancelResponse {}

message WatchPermissionsRequest {
  string session = 1;
}

message PendingPermission {
  string request_id = 1;
  // Canonical ACP RequestPermissionRequest using the daemon session id.
  AcpPayload request = 2;
}

message PermissionSnapshot {
  string session = 1;
  repeated PendingPermission pending = 2;
}

message RespondPermissionRequest {
  string session = 1;
  string request_id = 2;
  // Canonical ACP RequestPermissionResponse.
  AcpPayload response = 3;
}

message RespondPermissionResponse {}

message SetTitleRequest {
  string session = 1;
  string title = 2;
}

message SetTitleResponse {}

message LoadHistoryRequest {
  string session = 1;
  // Absent starts at the oldest retained event. An explicitly supplied cursor
  // must still be recoverable, otherwise the server returns DATA_LOSS.
  optional uint64 after = 2;
  uint32 limit = 3;
}

message LoadHistoryResponse {
  repeated Event events = 1;
  // Cursor to pass as `after` for the next page; absent at the end of history.
  optional uint64 next = 2;
}
