[package]
name = "bas"
version = "0.1.0"
edition = "2024"
description = "Bas — Basic Agent Service"
license = "MIT"

[lib]
name = "bas"
path = "src/lib.rs"

[[bin]]
name = "bas"
path = "src/bin/bas/main.rs"

[[bin]]
name = "bast"
path = "src/bin/bast/main.rs"

[[bin]]
name = "basg"
path = "src/bin/basg/main.rs"
required-features = ["gui"]

[features]
default = []
gui = [
    "dep:fluent-bundle",
    "dep:unic-langid",
    "dep:gds-uim",
    "dep:gpui-kit",
    "dep:reqwest_client",
    "dep:serde_json_lenient",
    "dep:base64",
    "dep:mime_guess",
    "dep:url",
    "dep:vt100",
    "dep:unicode-segmentation",
    "dep:wl-clipboard-rs",
    "dep:arboard",
    "dep:png",
    "dep:similar",
    "dep:markdown",
    "dep:html5ever",
    "dep:markup5ever_rcdom",
    "dep:rodio",
]
gui-tests = ["gui", "gpui-kit/test-support"]

[dependencies]
agent-client-protocol = { version = "=3.3.0", features = ["process", "schemars", "unstable", "unstable_protocol_v2"] }
anyhow = "1"
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
email_address = { version = "0.2", default-features = false }
futures = "0.3"
fluent-bundle = { version = "=0.16.0", optional = true }
unic-langid = { version = "0.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
regex = "1"
rodio = { version = "=0.21.1", optional = true, default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "tracing"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
zip = { version = "4", default-features = false, features = ["deflate"] }
semver = "1"
gds-uim = { path = "vendor/gds-uim", optional = true }
gpui-kit = { version = "=0.6.6", optional = true, features = [
    "tree-sitter-markdown",
    "tree-sitter-rust",
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-diff",
] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.6", optional = true }
mime_guess = { version = "2", optional = true }
markdown = { version = "=1.0.0", optional = true }
html5ever = { version = "=0.27.0", optional = true }
markup5ever_rcdom = { version = "=0.3.0", optional = true }
url = { version = "2", optional = true }
vt100 = { version = "0.16", optional = true }
unicode-segmentation = { version = "1", optional = true }
tempfile = "3"
prost = "0.14"
prost-types = "0.14"
toasty = { version = "=0.11.0", default-features = false, features = ["sqlite", "migration"] }
toasty-driver-sqlite = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_lenient = { version = "0.2", optional = true }
similar = { version = "2", optional = true }
strum = { version = "0.28", features = ["derive"] }
thiserror = { version = "2" }
time = { version = "0.3", features = ["parsing", "macros"] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
which = "8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
# Test-only external SQLite writer for lock-contention regression coverage.
rusqlite = "=0.40.2"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "poll", "process", "signal", "term", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = { version = "=0.9.4", optional = true }
sd-notify = "0.5"
tracing-journald = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "=3.6.1", optional = true }
png = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
