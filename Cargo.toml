[package]
name = "basr"
version = "0.1.0"
edition = "2024"
description = "BASR — Basic Agent Service in Rust"
license = "MIT"

[lib]
name = "basr"
path = "src/lib.rs"

[[bin]]
name = "basrd"
path = "src/bin/basrd/main.rs"

[[bin]]
name = "basrctl"
path = "src/bin/basrctl/main.rs"

[dependencies]
agent-client-protocol = "2"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2" }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5"
tracing-journald = "0.3"
