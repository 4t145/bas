[package]
name = "basr"
version = "0.1.0"
edition = "2024"
description = "BASR — Basic Agent Service in Rust"
license = "MIT"

[lib]
name = "basr"
path = "src/lib.rs"

[[bin]]
name = "basrd"
path = "src/bin/basrd/main.rs"

[[bin]]
name = "basrctl"
path = "src/bin/basrctl/main.rs"

[[bin]]
name = "basrw"
path = "src/bin/basrw/main.rs"
required-features = ["gui"]

[features]
default = []
gui = [
    "dep:gpui-kit",
    "dep:reqwest_client",
    "dep:serde_json_lenient",
    "dep:base64",
    "dep:mime_guess",
    "dep:url",
    "dep:vt100",
    "dep:unicode-segmentation",
]
gui-tests = ["gui", "gpui-kit/test-support"]

[dependencies]
agent-client-protocol = "2"
anyhow = "1"
async-trait = "0.1"
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
gpui-kit = { version = "=0.6.1", optional = true, features = [
    "tree-sitter-markdown",
    "tree-sitter-rust",
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-diff",
] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.5", optional = true }
mime_guess = { version = "2", optional = true }
url = { version = "2", optional = true }
vt100 = { version = "0.16", optional = true }
unicode-segmentation = { version = "1", optional = true }
tempfile = "3"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_lenient = { version = "0.2", optional = true }
strum = { version = "0.28", features = ["derive"] }
thiserror = { version = "2" }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
which = "8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5"
tracing-journald = "0.3"
