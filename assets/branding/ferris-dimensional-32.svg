<title id="dimensional-32-title">Ferris, wired halo — dimensional, 32px</title>
<desc id="dimensional-32-desc">Ferris with peacefully closed eyes, interlocking orange pincers with staggered crossings, and eight curved connector collars with cables entering behind the shell, four on each side. Small-size optical version with all eight connectors retained.</desc>
